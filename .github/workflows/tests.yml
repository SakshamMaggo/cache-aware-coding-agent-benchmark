name: benchmark checks

on:
  push:
  pull_request:

jobs:
  run-benchmark-checks:
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run task evaluator
        run: python -m src.test_runner

      - name: run rule-based repair baseline
        run: python -m src.repair_runner --fixer rule

      - name: analyze repair traces
        run: python -m src.trace_analyzer
        
      - name: run prompt-layout experiment
        run: python -m src.experiment_runner

      - name: run backend comparison
        run: python -m src.backend_compare